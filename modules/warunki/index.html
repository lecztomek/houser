<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warunki</title>
<link rel="stylesheet" href="../../shared/theme.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
.page{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--hs-panel);border-bottom:1px solid var(--hs-line);padding:12px 16px;display:grid;gap:10px}
.topRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topRow .grow{flex:1}
.btn{border:1px solid var(--hs-line-strong);background:var(--hs-panel);color:var(--hs-text);padding:5px 9px;border-radius:var(--hs-radius);font:600 12px var(--hs-font);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hs-panel-2);border-color:#94a3b8}
.btn.primary{background:var(--hs-accent);border-color:var(--hs-accent);color:#fff}
.btn.danger{color:var(--hs-bad);border-color:#fecaca}
.btn.icon{padding:4px 7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],select{border:1px solid var(--hs-line-strong);border-radius:6px;padding:4px 6px;min-height:28px;font:inherit;font-size:12px;background:#fff;color:var(--hs-text)}
input[type=number]{width:70px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;border:1px solid var(--hs-line);border-radius:999px;padding:3px 9px;background:var(--hs-panel-2);white-space:nowrap}
.badge.bad{color:var(--hs-bad);border-color:#fecaca;background:var(--hs-bad-soft)}
.badge.warn{color:#b45309;border-color:#fed7aa;background:#fff7ed}
.badge.soft{color:#a16207;border-color:#fde68a;background:#fefce8}
.badge.ok{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
.status{font-size:12px;color:var(--hs-muted)}
.status b{color:var(--hs-text)}
main{padding:12px 16px 40px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:#fff;border:1px solid var(--hs-line);border-radius:var(--hs-radius-lg);overflow:hidden;box-shadow:var(--hs-shadow)}
th{position:sticky;top:0;text-align:left;font-size:11px;font-weight:600;color:var(--hs-muted);padding:8px;border-bottom:1px solid var(--hs-line);background:var(--hs-panel-2)}
td{padding:5px 8px;border-bottom:1px solid var(--hs-line);vertical-align:middle}
tr.grp td{background:var(--hs-panel-2);font:700 13px var(--hs-font);cursor:pointer;padding:8px}
tr.grp td small{font-weight:500;color:var(--hs-muted);margin-left:8px}
tr.grp .car{display:inline-block;width:14px;color:var(--hs-muted);transition:transform .15s}
tr.grp.open .car{transform:rotate(90deg)}
tr.c.off td{opacity:.5}
tr.c.bad td:first-child{box-shadow:inset 3px 0 0 var(--hs-bad)}
tr.c.bad.medium td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
tr.c.bad.soft td:first-child{box-shadow:inset 3px 0 0 #eab308}
tr.c.ok td:first-child{box-shadow:inset 3px 0 0 #22c55e}
.st{font-weight:800;font-size:14px;width:22px;text-align:center}
.st.ok{color:#16a34a}.st.bad{color:var(--hs-bad)}.st.medium{color:#d97706}.st.soft{color:#ca8a04}.st.off{color:var(--hs-muted)}
.detail{font-size:11px;color:var(--hs-muted);white-space:nowrap}
.label input{width:100%;min-width:220px}
.params{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.params .u{color:var(--hs-muted);font-size:11px}
details.ms{position:relative}
details.ms>summary{list-style:none;cursor:pointer;border:1px solid var(--hs-line-strong);border-radius:6px;padding:4px 8px;background:#fff;font-size:12px;white-space:nowrap}
details.ms>summary::-webkit-details-marker{display:none}
details.ms[open]>div{position:absolute;z-index:20;top:100%;left:0;margin-top:3px;background:#fff;border:1px solid var(--hs-line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.15);padding:8px;display:grid;gap:4px;min-width:200px;max-height:240px;overflow:auto}
details.ms label{display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.empty{padding:40px;text-align:center;color:var(--hs-muted)}
.sev select{font-weight:600}
</style>
</head>
<body>
<div class="page">
<div class="top">
  <div class="topRow">
    <div><h1 class="hs-title">Warunki</h1></div>
    <div class="badges" id="summary"></div>
    <div class="grow"></div>
    <label class="btn primary">Wczytaj definicję lub projekt<input id="file" type="file" accept="application/json,.json" hidden></label>
    <button id="exportDef" class="btn" disabled>Eksportuj definicję</button>
  </div>
  <div class="topRow" id="toolbar" hidden>
    <input id="q" type="search" placeholder="Szukaj…" style="min-width:220px">
    <select id="fFloor"></select>
    <select id="fSev"><option value="">Każdy priorytet</option><option value="hard">Twardy</option><option value="medium">Ważny</option><option value="soft">Miękki</option></select>
    <select id="fState"><option value="">Wszystkie</option><option value="bad">Tylko niespełnione</option><option value="ok">Tylko spełnione</option><option value="off">Wyłączone</option></select>
    <button id="expandAll" class="btn">Rozwiń wszystko</button><button id="collapseAll" class="btn">Zwiń wszystko</button>
    <div class="grow"></div>
    <select id="newType"></select><button id="addCond" class="btn primary">+ Dodaj warunek</button>
  </div>
  <div id="status" class="status"></div>
</div>
<main id="main"></main>
</div>

<script src="../../shared/definition.js"></script>
<script src="../../shared/validator.js"></script>
<script src="../../shared/project-store.js"></script>
<script>
const $=id=>document.getElementById(id), D=HouserDefinition;
let project=null, source='', results=[], open=new Set(), firstRender=true, focusIndex=null;
const def=()=>project?.definitionSnapshot;
const conds=()=>{const d=def();if(!Array.isArray(d.conditions))d.conditions=[];return d.conditions};

function setProject(p,src){project=p&&p.definitionSnapshot?p:null;source=src||'';evaluate();renderAll()}
function evaluate(){results=[];if(!project)return;try{const v=HouserValidator.create(project);results=conds().map(c=>c.enabled===false?null:v.evaluate(c))}catch(e){console.error(e)}}
function save(){if(project)HouserStore.save(project,'warunki')}
function commit(i,fn,rerender=true){const c=JSON.parse(JSON.stringify(conds()[i]));fn(c);conds()[i]=D.normalizeCondition(c,def());evaluate();if(rerender)renderAll();else{renderSummary();refreshRow(i)}save()}

// ---------- podsumowanie
function renderSummary(){
  $('exportDef').disabled=!project;$('toolbar').hidden=!project;
  if(!project){$('summary').innerHTML='';$('status').innerHTML='Brak projektu. Najpierw ustaw pomieszczenia w module <b>Pomieszczenia</b> albo wczytaj definicję.';return}
  const act=conds().map((c,i)=>[c,results[i]]).filter(([c,r])=>r),bad=s=>act.filter(([c,r])=>!r.ok&&c.severity===s).length,ok=act.filter(([,r])=>r.ok).length;
  $('summary').innerHTML='<span class="badge bad">Twarde błędy: '+bad('hard')+'</span><span class="badge warn">Ważne: '+bad('medium')+'</span><span class="badge soft">Miękkie: '+bad('soft')+'</span><span class="badge ok">Spełnione: '+ok+' / '+act.length+'</span>';
  const painted=Object.values(project.state||{}).some(s=>Array.isArray(s)&&(Array.isArray(s[0])?s.flat():s).some(Boolean));
  $('status').innerHTML='<b>'+(source==='plik'?'Wczytany plik':'Bieżący projekt')+'</b> – '+conds().length+' warunków. '+(painted?'Status liczony na bieżąco z rzutu z modułu Układ pomieszczeń.':'Rzut jest jeszcze pusty – większość warunków będzie niespełniona, dopóki nie narysujesz układu.');
}

// ---------- kontrolki
function sel(value,options,onChange,cls){const s=document.createElement('select');if(cls)s.className=cls;for(const o of options){const op=document.createElement('option');op.value=o.value;op.textContent=o.label;s.appendChild(op)}s.value=value??'';s.addEventListener('change',()=>onChange(s.value));return s}
function num(value,step,onChange,min,max){const e=document.createElement('input');e.type='number';e.step=step;if(min!=null)e.min=min;if(max!=null)e.max=max;e.value=value??'';e.addEventListener('change',()=>{const v=Number(e.value);if(Number.isFinite(v))onChange(v)});return e}
function txt(value,onChange,ph){const e=document.createElement('input');e.type='text';e.value=value||'';if(ph)e.placeholder=ph;e.addEventListener('change',()=>onChange(e.value));return e}
function multi(values,options,onChange,noun){const d=document.createElement('details');d.className='ms';const set=new Set(values||[]);const sm=document.createElement('summary');const upd=()=>{sm.textContent=(set.size===options.length?'wszystkie ':set.size+' ')+noun+' ▾'};upd();d.appendChild(sm);const box=document.createElement('div');
  for(const o of options){const l=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=set.has(o.value);cb.addEventListener('change',()=>{cb.checked?set.add(o.value):set.delete(o.value);upd()});l.append(cb,document.createTextNode(o.label));box.appendChild(l)}
  d.appendChild(box);d.addEventListener('toggle',()=>{if(!d.open)onChange([...set])});return d}
const unit=t=>{const s=document.createElement('span');s.className='u';s.textContent=t;return s};

function paramsFor(i,c){
  const d=def(),wrap=document.createElement('div');wrap.className='params';
  const floorsOpt=D.floors(d).map(f=>({value:f,label:D.floorDef(d,f).name||f})),roomsOpt=f=>D.rooms(d,f).map(r=>({value:r.id,label:r.name})),typesOpt=D.openingTypes(d).map(t=>({value:t.id,label:t.name}));
  const edgeOpt=['north','east','south','west','any'].map(v=>({value:v,label:'elew. '+D.DIR_PL[v]}));
  const C=(fn)=>v=>commit(i,x=>fn(x,v));
  const floorSel=key=>sel(c[key],floorsOpt,C((x,v)=>{x[key]=v;if(key==='floor'){x.room=null;x.a=null;x.b=null;x.startRoom=null;x.rooms=[]}if(key==='upperFloor')x.upperRoom=null;if(key==='lowerFloor'){x.lowerRoom=null;x.lowerRooms=[]}}));
  const roomSel=(key,fk='floor')=>sel(c[key],roomsOpt(c[fk]),C((x,v)=>x[key]=v));
  const add=(...els)=>wrap.append(...els);
  switch(c.type){
    case 'minArea':case 'maxArea':add(floorSel('floor'),roomSel('room'),unit(c.type==='minArea'?'≥':'≤'),num(c.value,.25,C((x,v)=>x.value=v),0),unit('m²'));break;
    case 'fullPainted':case 'contiguousAll':case 'validOpenings':add(floorSel('floor'));break;
    case 'adjacent':case 'notAdjacent':add(floorSel('floor'),roomSel('a'),unit(c.type==='adjacent'?'↔':'✕'),roomSel('b'));break;
    case 'sharedEdgeMin':add(floorSel('floor'),roomSel('a'),unit('↔'),roomSel('b'),unit('ściana ≥'),num(c.meters,.1,C((x,v)=>x.meters=v),.1),unit('m'));break;
    case 'openingBetween':add(floorSel('floor'),roomSel('a'),unit('↔'),roomSel('b'),unit('otwór ≥'),num(c.meters,.1,C((x,v)=>x.meters=v),.1),unit('m'),multi(c.types,typesOpt,C((x,v)=>x.types=v),'typy'));break;
    case 'edge':add(floorSel('floor'),roomSel('room'),sel(c.edge,edgeOpt,C((x,v)=>x.edge=v)));break;
    case 'edgeLengthMin':add(floorSel('floor'),roomSel('room'),sel(c.edge,edgeOpt,C((x,v)=>x.edge=v)),unit('≥'),num(c.meters,.1,C((x,v)=>x.meters=v),.1),unit('m'));break;
    case 'minRoomWidth':add(floorSel('floor'),roomSel('room'),unit('szer. ≥'),num(c.meters,.1,C((x,v)=>x.meters=v),.1),unit('m'));break;
    case 'exactOverlay':add(floorSel('upperFloor'),roomSel('upperRoom','upperFloor'),unit('nad'),floorSel('lowerFloor'),roomSel('lowerRoom','lowerFloor'));break;
    case 'overlapMin':add(floorSel('upperFloor'),roomSel('upperRoom','upperFloor'),unit('nad'),floorSel('lowerFloor'),multi(c.lowerRooms,roomsOpt(c.lowerFloor),C((x,v)=>x.lowerRooms=v),'pom.'),unit('≥'),num(c.ratio,.05,C((x,v)=>x.ratio=v),0,1));break;
    case 'exteriorOpening':add(floorSel('floor'),roomSel('room'),sel(c.edge,edgeOpt,C((x,v)=>x.edge=v)),unit('≥'),num(c.meters,.1,C((x,v)=>x.meters=v),.1),unit('m'),multi(c.types,typesOpt,C((x,v)=>x.types=v),'typy'));break;
    case 'reachableRooms':add(floorSel('floor'),unit('od'),roomSel('startRoom'),multi(c.rooms,roomsOpt(c.floor),C((x,v)=>x.rooms=v),'pom.'),multi(c.types,typesOpt,C((x,v)=>x.types=v),'przejścia'));break;
  }
  return wrap;
}

// ---------- tabela
function statusCell(i){const c=conds()[i],r=results[i],td=document.createElement('td');td.className='st '+(!r?'off':r.ok?'ok':(c.severity==='hard'?'bad':c.severity));td.textContent=!r?'–':r.ok?'✓':'✗';td.title=!r?'wyłączony':(r.ok?'spełniony':'niespełniony')+(r.detail?' – '+r.detail:'');return td}
function rowClass(i){const c=conds()[i],r=results[i];return 'c '+(!r?'off':r.ok?'ok':'bad '+c.severity)}
function buildRow(i){
  const c=conds()[i],r=results[i],d=def(),tr=document.createElement('tr');tr.className=rowClass(i);tr.dataset.i=i;
  tr.appendChild(statusCell(i));
  const tOn=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.checked=c.enabled!==false;cb.title='Włącz / wyłącz';cb.addEventListener('change',()=>commit(i,x=>x.enabled=cb.checked,false));tOn.appendChild(cb);tr.appendChild(tOn);
  const tL=document.createElement('td');tL.className='label';tL.appendChild(txt(c.label,v=>commit(i,x=>x.label=v.trim(),false),D.conditionLabel({...c,label:''},d)));const det=document.createElement('div');det.className='detail';det.textContent=r?.detail||'';tL.appendChild(det);tr.appendChild(tL);
  const tT=document.createElement('td');tT.appendChild(sel(c.type,Object.entries(D.CONDITION_TYPE_NAMES).map(([value,label])=>({value,label})),v=>{const keep={severity:c.severity,enabled:c.enabled,group:c.group,label:''};conds()[i]={...D.defaultCondition(v,d),...keep,type:v};evaluate();renderAll();save()}));tr.appendChild(tT);
  const tP=document.createElement('td');tP.appendChild(paramsFor(i,c));tr.appendChild(tP);
  const tS=document.createElement('td');tS.className='sev';tS.appendChild(sel(c.severity,Object.entries(D.SEVERITY).map(([value,label])=>({value,label})),v=>commit(i,x=>x.severity=v,false)));tr.appendChild(tS);
  const tG=document.createElement('td');const g=txt(c.group,v=>commit(i,x=>x.group=v.trim()||'Warunki'));g.style.width='150px';g.setAttribute('list','groupList');tG.appendChild(g);tr.appendChild(tG);
  const tA=document.createElement('td');tA.className='acts';
  const dup=document.createElement('button');dup.className='btn icon';dup.title='Duplikuj';dup.textContent='⧉';dup.onclick=()=>{conds().splice(i+1,0,JSON.parse(JSON.stringify(c)));focusIndex=i+1;evaluate();renderAll();save()};
  const del=document.createElement('button');del.className='btn icon danger';del.title='Usuń';del.textContent='✕';del.onclick=()=>{if(!confirm('Usunąć warunek „'+D.conditionLabel(c,d)+'”?'))return;conds().splice(i,1);evaluate();renderAll();save()};
  tA.append(dup,' ',del);tr.appendChild(tA);
  return tr;
}
function refreshRow(i){const old=document.querySelector('tr.c[data-i="'+i+'"]');if(!old)return;old.className=rowClass(i);old.replaceChild(statusCell(i),old.firstChild);const det=old.querySelector('.detail');if(det)det.textContent=results[i]?.detail||'';}
function renderTable(){
  const main=$('main');
  if(!project){main.innerHTML='<div class="empty">Wczytaj definicję albo zacznij w module Pomieszczenia.</div>';return}
  const q=$('q').value.trim().toLowerCase(),ff=$('fFloor').value,fsev=$('fSev').value,fst=$('fState').value,d=def(),groups=new Map();
  conds().forEach((c,i)=>{const r=results[i],label=D.conditionLabel(c,d),hay=(label+' '+c.group+' '+(D.CONDITION_TYPE_NAMES[c.type]||'')).toLowerCase();
    if(q&&!hay.includes(q))return;if(fsev&&c.severity!==fsev)return;if(ff&&![c.floor,c.upperFloor,c.lowerFloor].includes(ff))return;
    if(fst==='bad'&&!(r&&!r.ok))return;if(fst==='ok'&&!(r&&r.ok))return;if(fst==='off'&&r)return;
    const g=c.group||'Warunki';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(i)});
  if(firstRender){firstRender=false;for(const [g,idx] of groups)if(idx.some(i=>results[i]&&!results[i].ok))open.add(g)}
  const filtering=!!(q||fst||fsev||ff);
  const table=document.createElement('table');table.innerHTML='<thead><tr><th></th><th></th><th>Opis (puste = automatyczny)</th><th>Typ</th><th>Parametry</th><th>Priorytet</th><th>Grupa</th><th></th></tr></thead>';
  const tb=document.createElement('tbody');
  for(const [g,idx] of groups){
    const isOpen=open.has(g)||filtering||idx.includes(focusIndex),bad=idx.filter(i=>results[i]&&!results[i].ok).length,act=idx.filter(i=>results[i]).length;
    const h=document.createElement('tr');h.className='grp'+(isOpen?' open':'');h.innerHTML='<td colspan="8"><span class="car">▸</span></td>';
    h.firstChild.append(document.createTextNode(g));const sm=document.createElement('small');sm.innerHTML=(bad?'<span style="color:var(--hs-bad)">✗ '+bad+'</span> · ':'')+'✓ '+(act-bad)+' / '+idx.length;h.firstChild.appendChild(sm);
    h.onclick=()=>{open.has(g)?open.delete(g):open.add(g);renderTable()};tb.appendChild(h);
    if(isOpen)for(const i of idx)tb.appendChild(buildRow(i));
  }
  if(!groups.size)tb.innerHTML='<tr><td colspan="8" class="empty">Brak pasujących warunków.</td></tr>';
  table.appendChild(tb);main.innerHTML='';main.appendChild(table);
  const dl=document.createElement('datalist');dl.id='groupList';dl.innerHTML=[...new Set(conds().map(c=>c.group))].map(g=>'<option value="'+esc(g)+'">').join('');main.appendChild(dl);
  if(focusIndex!=null){const tr=document.querySelector('tr.c[data-i="'+focusIndex+'"]');tr?.scrollIntoView({block:'center'});tr?.querySelector('input[type=text]')?.focus();focusIndex=null}
}
function renderFilters(){if(!project)return;const fs=$('fFloor'),cur=fs.value;fs.innerHTML='<option value="">Każda kondygnacja</option>'+D.floors(def()).map(f=>'<option value="'+f+'">'+esc(D.floorDef(def(),f).name||f)+'</option>').join('');fs.value=cur}
for(const id of ['q','fFloor','fSev','fState'])$(id).addEventListener('input',renderTable);
$('expandAll').onclick=()=>{for(const c of conds())open.add(c.group||'Warunki');renderTable()};
$('collapseAll').onclick=()=>{open.clear();renderTable()};
$('newType').innerHTML=Object.entries(D.CONDITION_TYPE_NAMES).map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('');
$('addCond').onclick=()=>{if(!project)return;const c=D.defaultCondition($('newType').value,def());conds().push(c);focusIndex=conds().length-1;open.add(c.group);evaluate();renderAll();save()};

function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function renderAll(){renderSummary();renderFilters();renderTable()}
$('exportDef').onclick=()=>{if(!project)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(def(),null,2)],{type:'application/json'}));a.download='dom-definicja.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const o=JSON.parse(await f.text());let p;if(o.definitionSnapshot)p=o;else if(D.isDefinition(o))p=D.projectFromDefinition(o);else throw new Error('to nie jest definicja ani projekt domu');firstRender=true;setProject(p,'plik');save()}catch(err){alert('Nie udało się wczytać pliku: '+err.message)}e.target.value=''});

const rec=HouserStore.load();
setProject(rec?rec.project:null,rec?'store':'');
// zmiany z innych modułów (np. rzut w Układzie pomieszczeń) – przelicz statusy; nie przerywaj edycji
HouserStore.subscribe(r=>{const a=document.activeElement;if(a&&a.closest('main')&&['INPUT','SELECT'].includes(a.tagName)){project=r.project;evaluate();renderSummary();conds().forEach((_,i)=>refreshRow(i));return}setProject(r.project,'store')});
</script>
<script src="../../shared/nav.js"></script>
</body>
</html>
