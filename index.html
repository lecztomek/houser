<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<script src="shared/i18n-en.js"></script>
<script src="shared/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Houser – projektowanie domu</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
:root{--bg:var(--hs-bg);--panel:var(--hs-panel);--line:var(--hs-line);--text:var(--hs-text);--muted:var(--hs-muted);--accent:var(--hs-accent)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{display:grid;grid-template-columns:78px minmax(0,1fr);height:100vh;overflow:hidden}
/* ---- menu boczne: zawsze wąski pasek ikon; burger wysuwa pełne menu NA WIERZCH (treść się nie przesuwa) */
#nav{position:fixed;left:0;top:0;bottom:0;width:78px;display:flex;flex-direction:column;background:#eef2f6;border-right:1px solid #d3dbe5;box-shadow:4px 0 14px -10px rgba(15,23,42,.35);z-index:30;transition:width .18s ease,box-shadow .18s ease;overflow:hidden}
body.navopen #nav{width:320px;box-shadow:12px 0 32px rgba(15,23,42,.22)}
.navtop{display:flex;align-items:center;gap:6px;padding:10px 9px 8px}
.brand{flex:0 0 auto;min-width:0;font-weight:750;font-size:17px;letter-spacing:-.01em;white-space:nowrap;color:#0f172a;text-decoration:none;display:flex;align-items:center;gap:9px;padding:5px;border-radius:11px;border:1px solid transparent}
.brand .mark{flex:0 0 auto;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.35)}
.brand svg,.burger svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand:hover{background:#fff;border-color:#dbe2ea}
.brand.active{background:#fff;border-color:#60a5fa;box-shadow:0 0 0 2px rgba(59,130,246,.18)}
.burger{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid #d3dbe5;background:#fff;color:#334155;display:grid;place-items:center;cursor:pointer}
.burger:hover{border-color:#94a3b8;color:#0f172a}
#tabs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 12px 14px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
#tabs .grp{--gc:#8391a5;display:flex;align-items:center;gap:7px;font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gc);padding:12px 8px 5px;white-space:nowrap;background:none;border:0;cursor:pointer;text-align:left;width:100%}
#tabs .grp:before{content:'';flex:0 0 auto;width:8px;height:8px;border-radius:3px;background:var(--gc)}
#tabs .grp .gn{flex:1;overflow:hidden;text-overflow:ellipsis}
#tabs .grp .gc{font-size:10px;color:#9aa6b6;font-weight:700;letter-spacing:0}
#tabs .grp .gv{font-size:10px;color:#9aa6b6;transition:transform .15s;display:inline-block}
#tabs .grp.shut .gv{transform:rotate(-90deg)}
#tabs .grp:hover .gn{text-decoration:underline}
.tab.hid:not(.active){display:none}
.tab{--gc:#64748b;--gt:#f1f5f9;display:flex;align-items:center;gap:12px;min-height:48px;padding:5px 10px 5px 6px;border:1px solid transparent;border-radius:10px;background:transparent;color:#1e293b;cursor:pointer;font:600 14.5px/1.2 var(--hs-font);text-align:left;width:100%;transition:background .12s,border-color .12s;white-space:nowrap}
.tab .ic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gt);color:var(--gc)}
.tab .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab .no{font-size:12px;font-weight:600;color:#9aa6b6;font-variant-numeric:tabular-nums}
.tab:hover{background:#fff;border-color:#dbe2ea}
.tab.active{background:#fff;border-color:#93c5fd;color:#1d4ed8;box-shadow:0 1px 3px rgba(15,23,42,.08),0 0 0 2px rgba(59,130,246,.12)}
.tab.active .ic{background:var(--gc);color:#fff}
.tab.active .no{color:#60a5fa}
/* pasek (zamknięte): same ikony, burger nad logo */
body:not(.navopen) .brand>span:last-child,body:not(.navopen) .tab .tx,body:not(.navopen) .tab .no{display:none}
body:not(.navopen) .navtop{flex-direction:column}
body:not(.navopen) #tabs{padding:2px 10px 14px}
body:not(.navopen) #tabs .grp{font-size:0;padding:0;margin:8px 6px 4px;border-top:3px solid var(--gc);border-radius:2px;width:auto;cursor:default}
body:not(.navopen) #tabs .grp:before,body:not(.navopen) #tabs .grp .gc,body:not(.navopen) #tabs .grp .gv{display:none}
body:not(.navopen) .tab.hid{display:flex}
body:not(.navopen) #tabs .grp:first-of-type{border-top:0}
body:not(.navopen) .tab{justify-content:center;padding:4px}
body.navopen .brand{flex:1}
.scrim{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,23,42,.28);z-index:29}
body.navopen .scrim{display:block}
.content{grid-column:2;min-width:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.burger.mobile{display:none}
.navclose{display:none}
@media(max-width:800px),(hover:none) and (pointer:coarse) and (max-width:1100px){
  body{grid-template-columns:minmax(0,1fr)}
  .content{grid-column:1}
  #nav{transform:translateX(-105%);transition:transform .2s ease;width:min(320px,88vw)!important}
  body.navopen #nav{transform:none}
  .burger.mobile{display:grid;width:44px;height:44px;flex:0 0 auto}
  #nav{width:min(300px,82vw)!important}
  #nav #burger{display:none}
  #nav .navclose{display:grid;width:44px;height:44px}
  body.navopen .brand{flex:1}
  .projbar{min-height:56px;padding:6px 8px!important;padding-top:max(6px,env(safe-area-inset-top))!important}
  .projbar .pbtn,#pbUser{min-height:42px;min-width:42px;justify-content:center;touch-action:manipulation}
  .lang button{min-height:40px;min-width:40px;touch-action:manipulation}
  .tab{min-height:52px}
  .projbar{flex-wrap:nowrap!important;gap:5px;padding:6px 8px}
  .projbar .plabel,.projbar #pbMeta,.projbar #openExt,.projbar .lbl{display:none!important}
  .projbar .name{max-width:none;flex:1 1 auto;min-width:0}
  .pbcloud .vis,#pbUser span{display:none}
  .pbtn{padding:5px 8px}
}
@media(max-width:380px){
  .projbar #pbRedo,.projbar #pbCloud{display:none!important}
  .projbar .name{min-width:40px}
}
.spacer{flex:1}
.ext{color:var(--hs-accent);font-size:12px;text-decoration:none;white-space:nowrap;padding:0 6px}
main{position:relative;min-height:0}
.projbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;background:#f8fafc;border-bottom:1px solid #d3dbe5;box-shadow:0 8px 16px -12px rgba(15,23,42,.45);padding:7px 12px;font-size:13px;position:relative;z-index:4}
.projbar .name{font-weight:700;max-width:300px;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}

.hcard img,.prow img{display:block}
.rcard .thumb img{width:100%;height:130px;object-fit:cover;border-radius:8px}

.btn2.ib{min-width:34px;padding-left:0;padding-right:0;justify-content:center}.pacts .icons{display:inline-flex;gap:4px}.pacts .visSel{font-size:12.5px;padding:5px 6px;max-width:200px}
.pmtools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}.pmtools .pmfilter{margin:0}.pmview{display:flex;gap:6px}

// Moduły w kolejności projektowania. group: etap, step: numer kroku na karcie.
const MODULES=[
  {id:'generator',group:'Bryła i założenia',name:'Generator układu',src:'modules/generator/',desc:'Odpowiadasz na kilka pytań (ile osób, sypialni, parterowy czy z poddaszem, kuchnia, garaż, antresola, strony świata), z odpowiedzi powstaje lista warunków, a algorytm genetyczny układa pomieszczenia, schody i pustkę tak, żeby spełnić je jak najlepiej i nie marnować miejsca. Wybrany wariant zapisujesz jako nowy projekt.'},
  {id:'obrys',group:'Bryła i założenia',name:'Obrys domu',src:'modules/obrys/',desc:'Tu zaczynasz nowy projekt: kształt budynku rysowany po liniach siatki – dowolny (L, T, wnęki); siatka i warstwy dopasowują się same.'},
  {id:'kondygnacje-dach',group:'Bryła i założenia',name:'Kondygnacje i dach',src:'modules/kondygnacje-dach/',desc:'Widok z boku: parter, pełne piętro albo poddasze ze ścianką kolankową, kąt i kierunek dachu.'},
  {id:'pomieszczenia',group:'Bryła i założenia',name:'Pomieszczenia',src:'modules/pomieszczenia/',desc:'Jakie pomieszczenia ma dom i na której kondygnacji: nazwy, kolory, wnęki.'},
  {id:'warunki',group:'Bryła i założenia',name:'Warunki',src:'modules/warunki/',desc:'Zasady układu: powierzchnie, sąsiedztwa, szerokości, drzwi, dojście – pogrupowane i rozwijane.'},
  {id:'projektowanie',group:'Rzut',name:'Układ pomieszczeń',src:'modules/projektowanie/',desc:'Malowanie pomieszczeń na siatce, drzwi, okna i komin; walidacja warunków na bieżąco.'},
  {id:'schody',group:'Rzut',name:'Schody',src:'modules/schody/',desc:'Rodzaj schodów (proste, L, 180°, kręcone), parametry i wstawienie na rzut – kratki pojawiają się same.'},
  {id:'okna-drzwi',group:'Rzut',name:'Okna i drzwi zewnętrzne',src:'modules/okna-drzwi/',desc:'Rodzaje okien (niskie, balkonowe, naświetla, ścięte pod skos, dachowe) i drzwi, z podglądem elewacji.'},
  {id:'drzwi-wewnetrzne',group:'Rzut',name:'Drzwi wewnętrzne',src:'modules/drzwi-wewnetrzne/',desc:'Drzwi między pomieszczeniami na rzucie: rodzaj, wysokość (też niskie pod skosem) i kierunek otwierania.'},
  {id:'balkony',group:'Rzut',name:'Balkony',src:'modules/balkony/',desc:'Balkony na piętrze malowane kratkami: wystające poza ścianę albo nad częścią parteru, gdy piętro jest mniejsze – balustrada, łącznik termiczny, wyjście z pokoju.'},
  {id:'ocieplenie',group:'Konstrukcja i materiały',name:'Ocieplenie i elewacja',src:'modules/ocieplenie/',desc:'Z czego są ściany, dach i podłoga: mur, rodzaj i grubość ocieplenia, okna, wykończenie elewacji – współczynniki U do bilansu energii, koszt i czy warto grubiej.'},
  {id:'konstrukcja',group:'Konstrukcja i materiały',name:'Konstrukcja',src:'modules/konstrukcja/',desc:'Czy układ da się tanio zbudować: rozpiętość stropu (podciągi), ściany piętra nad ścianami parteru, wysunięcia, szerokie otwory i przeszklenia narożne, więźba dachu – z kosztem wzmocnień w Wycenie.'},
  {id:'konstrukcja-dachu',group:'Konstrukcja i materiały',name:'Konstrukcja dachu',src:'modules/konstrukcja-dachu/',desc:'Więźba dachu: krokwie, jętki, płatwie albo belka kalenicowa, przekroje elementów i na czym stoją słupy – także pustka na piętrze (słupy na całą wysokość, ściany i brzegi stropu bez podparcia)'},
  {id:'energia',group:'Energia i instalacje',name:'Energia',src:'modules/energia/',desc:'Bilans cieplny: straty przez przegrody i wentylację, moc grzewcza, zapotrzebowanie kWh/m² i koszt ogrzewania różnymi źródłami.'},
  {id:'ogrzewanie',group:'Energia i instalacje',name:'Ogrzewanie',src:'modules/ogrzewanie/',desc:'Porównanie źródeł ciepła: pompy ciepła, gaz, pellet, ekogroszek, drewno, kominek z płaszczem wodnym, prąd – koszt instalacji, rachunki, koszt w 20 lat i dopasowanie do domu.'},
  {id:'instalacja-grzewcza',group:'Energia i instalacje',name:'Instalacja grzewcza',src:'modules/instalacja-grzewcza/',desc:'Źródła ciepła (główne i alternatywne, np. pompa + kominek), urządzenia na rzucie: kocioł, jednostka zewnętrzna, bufor, zasobnik, rozdzielacze – i czym grzeje każdy pokój.'},
  {id:'wentylacja',group:'Energia i instalacje',name:'Wentylacja',src:'modules/wentylacja/',desc:'Porównanie sposobów wentylacji dla tego domu: grawitacyjna, hybrydowa, mechaniczna wywiewna, rekuperatory ścienne, rekuperacja – koszty, jakość powietrza, dopasowanie.'},
  {id:'rekuperacja',group:'Energia i instalacje',name:'Rekuperacja',src:'modules/rekuperacja/',desc:'Rekuperacja w szczegółach: jak bardzo potrzebna, strumienie powietrza, centrala i kanały, trudność montażu, koszt i zwrot.'},
  {id:'klimatyzacja',group:'Energia i instalacje',name:'Klimatyzacja',src:'modules/klimatyzacja/',desc:'Które pokoje latem się przegrzewają, jakiej mocy klimatyzatory, split czy multisplit, trudność montażu i koszt.'},
  {id:'fotowoltaika',group:'Energia i instalacje',name:'Fotowoltaika',src:'modules/fotowoltaika/',desc:'Panele na dachu: ile się zmieści na połaciach, produkcja w miesiącach wobec zużycia domu (z pompą ciepła), magazyn energii, oszczędność i zwrot – po włączeniu tańszy prąd w Ogrzewaniu i Energii.'},
  {id:'hydraulika',group:'Energia i instalacje',name:'Hydraulika',src:'modules/hydraulika/',desc:'Jak łatwo i tanio zrobić wod-kan: odległości łazienek, WC, kuchni i pralni od źródła ciepłej wody, piony parter–piętro, dopłata za układ.'},
  {id:'oswietlenie',group:'Energia i instalacje',name:'Oświetlenie',src:'modules/oswietlenie/',desc:'Lampy na rzucie (plafony, wiszące, oczka, kinkiety, taśmy LED) i mapa światła nocą: gdzie dociera, ciemne kąty, światło przez pustkę na parter i antresolę, zalecenia dla pomieszczeń, prąd i koszt opraw.'},
  {id:'elektryka',group:'Energia i instalacje',name:'Elektryka i oświetlenie',src:'modules/elektryka/',desc:'Gniazda, łączniki i punkty światła w każdym pomieszczeniu, obwody i rozdzielnica, urządzenia na osobnych obwodach, moc przyłączeniowa (z pompą ciepła, ładowarką, PV) i koszt instalacji do Wyceny.'},
  {id:'meblowanie',group:'Wnętrza',name:'Meblowanie',src:'modules/meblowanie/',desc:'Rozmieszczanie mebli na gotowym rzucie – pomieszczeń tu nie zmieniasz.'},
  {id:'schowki',group:'Wnętrza',name:'Wyposażenie i schowki',src:'modules/schowki/',desc:'Czy wszystko ma swoje miejsce: lodówka, zamrażarka, pralka, odkurzacz, rowery, walizki – przypisane do szaf, zabudowy i pomieszczeń. Ile miejsca na rzeczy: szafy i szafki, garderoby, spiżarnia, schowki, garaż, skosy, pod schodami – czy wystarczy dla domowników i gdzie brakuje wolnej ściany na szafę.'},
  {id:'tarasy',group:'Otoczenie',name:'Tarasy i pergole',src:'modules/tarasy/',desc:'Malowanie kratek wokół domu: taras, zadaszony taras, pergola.'},
  {id:'garaz',group:'Otoczenie',name:'Garaż',src:'modules/garaz/',desc:'Garaż w bryle domu, wolnostojący albo wiata: ile aut się zmieści, szerokość bramy, wymiary i koszt. Miejsce na działce – w module Działka.'},
  {id:'dzialka',group:'Otoczenie',name:'Działka',src:'modules/dzialka/',desc:'Gdzie stoi dom: wymiary działki, ulica, odległości od granic; malowanie podjazdu, chodników, miejsc postojowych, żwiru i rabat, drzewa, ogrodzenie. Widać w Zewnątrz 3D, koszt w Wycenie.'},
  {id:'wnetrze-3d',group:'Podgląd',name:'Wnętrze 3D',src:'modules/wnetrze-3d/',desc:'Spacer po domu z punktu obserwatora (strzałki), schody, skosy dachu, meble.'},
  {id:'zewnatrz-3d',group:'Podgląd',name:'Zewnątrz 3D',src:'modules/zewnatrz-3d/',desc:'Bryła domu z zewnątrz: dach, okna, drzwi, tarasy i pergole.'},
  {id:'wizualizacje',group:'Podgląd',name:'Wizualizacje AI',src:'modules/wizualizacje/',desc:'Zdjęcie z podglądu 3D zamienione przez AI (Gemini) na realistyczną wizualizację – prompt tworzy się sam z projektu.'},
  {id:'galeria',group:'Podgląd',name:'Galeria',src:'modules/galeria/',desc:'Wybrane zdjęcia domu: najlepsze wizualizacje AI, ujęcia z 3D i Twoje własne zdjęcia – okładka, podpisy, kolejność, pokaz i porównanie przed / po.'},
  {id:'przepisy',group:'Ocena domu',name:'Przepisy',src:'modules/przepisy/',desc:'Sprawdzenie z warunkami technicznymi: okna do podłogi 1:8, wysokości, drzwi, schody, powierzchnie pokoi – z mapą pomieszczeń.'},
  {id:'codziennosc',group:'Ocena domu',name:'Codzienność',src:'modules/codziennosc/',desc:'Jak się mieszka na co dzień: scenariusze (zakupy, pranie, palenie w piecu, goście, noc, łazienki i WC) – trasy po domu, odległości i przejścia przez pokoje, ocena i podpowiedzi.'},
  {id:'akustyka',group:'Ocena domu',name:'Akustyka',src:'modules/akustyka/',desc:'Czy w sypialniach będzie cicho: co jest za ścianą, nad i pod pokojem (garaż, pralnia, salon, łazienka, schody), ulica, antresola – ocena pokoi i podpowiedzi.'},
  {id:'naslonecznienie',group:'Ocena domu',name:'Nasłonecznienie',src:'modules/naslonecznienie/',desc:'Zyski od słońca latem i zimą, pomieszczenie po pomieszczeniu: ryzyko przegrzania, mapa ciepła, wpływ okapu, tarasu i rolet.'},
  {id:'wyglad',group:'Ocena domu',name:'Wygląd domu',src:'modules/wyglad/',desc:'Elewacje według zasad kompozycji: wyrównane okna, osie pionowe, symetria szczytów, rozmiary okien, puste ściany, dach – z rysunkiem, co poprawić.'},
  {id:'wycena',group:'Koszty i porównania',name:'Wycena',src:'modules/wycena/',desc:'Orientacyjny koszt budowy z projektu: ilości (ściany, strop, dach, okna, drzwi, instalacje, wykończenie) × ceny jednostkowe, które możesz zmienić.'},
  {id:'oszczednosci',group:'Koszty i porównania',name:'Oszczędności',src:'modules/oszczednosci/',desc:'Zmiany, które obniżają koszt budowy: ile oszczędzasz, jak zmieniają się rachunki i ocena domu – z przyciskiem Zastosuj.'},
  {id:'co-poprawic',group:'Koszty i porównania',name:'Co poprawić',src:'modules/co-poprawic/',desc:'Podsumowanie wszystkich analiz: 5 najważniejszych poprawek projektu, największe zalety i wady, oceny modułów w jednym miejscu.'},
  {id:'porownanie',group:'Koszty i porównania',name:'Porównanie domów',src:'modules/porownanie/',desc:'2–4 projekty obok siebie: metraż, koszt budowy (z etapami), energia, ogrzewanie, wentylacja, codzienność, przegrzewanie, akustyka, hydraulika, schowki – ocena ogólna wg Twoich wag, najlepsze wartości zaznaczone.'},
  {id:'ranking',group:'Koszty i porównania',name:'Ranking domów',src:'modules/ranking/',desc:'Wszystkie Twoje domy na jednej liście: ogólna ocena, koszt budowy, rachunki i cena do jakości – posortowane od najlepszego.'},
  {id:'notatki',group:'Notatki',name:'Notatki',src:'modules/notatki/',desc:'Pomysły, pytania do architekta i wykonawców, rzeczy do zrobienia, decyzje, problemy i oferty – prosta lista zapisana razem z projektem.'},
];

async function openProject(obj,label){
  if(!obj||typeof obj!=='object')throw new Error('To nie jest plik projektu.');
  let project={...obj};delete project.visualizations;delete project.houserFile; // obrazy nie są częścią pliku (starsze pliki mogły je mieć – pomijamy)
  if(!project.state&&!project.definitionSnapshot&&HouserDefinition.isDefinition(project))project=HouserDefinition.projectFromDefinition(project);
  if(!project.definitionSnapshot&&!project.state)throw new Error('Nie rozpoznaję pliku – brak definicji pomieszczeń i rzutu.');
  // gotowy dom, nowy projekt i import z pliku to zawsze nowy projekt (własny identyfikator i galeria) – import nigdy nie nadpisuje domu, z którego plik wyeksportowano
  if(label==='preview'&&project.readOnly?.src==='base'&&project.projectId){} // dom autora „Houser” ma stałe id (z pliku) – ten sam dom za każdym razem
  else if(label==='sample'||label==='preview'||label==='new'||label==='file'||!project.projectId)project.projectId=HouserStore.newId();
  if(label==='file'){delete project.readOnly;delete project.sharedEdit}
  const before=curJSON;
  if(!HouserStore.save(project,'plik'))throw new Error('Nie udało się zapisać projektu w przeglądarce (za mało miejsca?).');
  lsSet(LAST_SAVE,label==='file'?new Date().toISOString():'');
  pushUndo(before,'plik');curJSON=JSON.stringify(project);lastPush={t:0,src:''};echoUntil=Date.now()+3000;
  reloadModules();if(label!=='cloud'&&label!=='sample'&&label!=='preview')HouserCloud.touch('project');roWarned=false;renderBar();toast('Wczytano projekt „'+projName(project)+'”')}

function pastel(hex){const n=parseInt((hex||'#cbd5e1').slice(1),16),m=v=>Math.round(v+(255-v)*.45);return 'rgb('+m(n>>16&255)+','+m(n>>8&255)+','+m(n&255)+')'}
// miniaturka rzutu: parter i piętro obok siebie, pomieszczenia w kolorach z projektu, ściany na granicach
function planSvg(p){const g=p.grid||p.definitionSnapshot?.grid;if(!g)return '';const W=g.width,H=g.height,fl=(p.definitionSnapshot?.floorOrder||['ground','upper']);
  const flat=f=>{const st=p.state?.[f]||[];return Array.isArray(st[0])?st.flat():st},rooms=f=>Object.fromEntries((p.definitionSnapshot?.floors?.[f]?.rooms||[]).map(r=>[r.id,r]));
  const used=fl.filter(f=>flat(f).some(v=>v&&rooms(f)[v]?.kind!=='exteriorVoid'));if(!used.length)return '<svg viewBox="0 0 100 60"><text x="50" y="34" text-anchor="middle" font-size="7" fill="#94a3b8">pusty rzut</text></svg>';
  const S=10,gap=24,totalW=used.length*W*S+(used.length-1)*gap;let h='';
  used.forEach((f,i)=>{const st=flat(f),R=rooms(f),ox=i*(W*S+gap),id=(x,y)=>x<0||y<0||x>=W||y>=H?null:(st[y*W+x]||null),occ=(x,y)=>{const v=id(x,y);return v&&R[v]?.kind!=='exteriorVoid'};
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=id(x,y);if(!occ(x,y))continue;const hole=f!==fl[0]&&(v==='pustka'||v==='schody');{const fc=hole?'#f1f5f9':pastel(R[v]?.color);h+='<rect x="'+(ox+x*S)+'" y="'+y*S+'" width="'+S+'" height="'+S+'" fill="'+fc+'" stroke="'+fc+'" stroke-width="0.8"/>'}}
    const ln=(x1,y1,x2,y2,ext)=>'<line x1="'+(ox+x1)+'" y1="'+y1+'" x2="'+(ox+x2)+'" y2="'+y2+'" stroke="#334155" stroke-width="'+(ext?2.6:1.2)+'" stroke-linecap="square"/>';
    for(let y=0;y<=H;y++)for(let x=0;x<W;x++){const a=occ(x,y-1),b=occ(x,y);if(a!==b)h+=ln(x*S,y*S,(x+1)*S,y*S,1);else if(a&&id(x,y-1)!==id(x,y))h+=ln(x*S,y*S,(x+1)*S,y*S,0)}
    for(let x=0;x<=W;x++)for(let y=0;y<H;y++){const a=occ(x-1,y),b=occ(x,y);if(a!==b)h+=ln(x*S,y*S,x*S,(y+1)*S,1);else if(a&&id(x-1,y)!==id(x,y))h+=ln(x*S,y*S,x*S,(y+1)*S,0)}
    h+='<text x="'+(ox+W*S/2)+'" y="'+(H*S+16)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">'+(i===0?'Parter':(p.elevationSettings?.upperType==='attic'?'Poddasze':'Piętro'))+'</text>'});
  return '<svg viewBox="-4 -4 '+(totalW+8)+' '+(H*S+26)+'">'+h+'</svg>'}
function stats(p){try{const q=HouserQuantities.compute(p),fl=q.net[q.up]>0?(q.attic?'parter + poddasze':'dwie kondygnacje'):'parterowy';return {area:q.usableTotal,foot:q.foot,fl,rooms:q.rooms.filter(r=>r.area>=2).length,roof:q.G.roofPitch,todo:window.HouserComplete?HouserComplete.check(p).missing:null}}catch(_){return null}}
const chips=st=>st?'<span class="chip">'+Math.round(st.area)+' m² użytkowej</span><span class="chip">'+st.fl+'</span><span class="chip">'+st.rooms+' pomieszczeń</span><span class="chip">dach '+Math.round(st.roof)+'°</span>':'';

function renderCur(){const rec=HouserStore.load(),el=$('curProj');if(!el)return;

async function findUntouched(all){const out=[],seen=new Set();
  const noPhotos=async m=>!(await HouserGallery.list(m.id)).length&&!m.cover;
  // 2) kilka moich domów o tej samej nazwie – zostaje najnowszy ze zdjęciami (a gdy żaden nie ma zdjęć – najnowszy), reszta to duplikaty
  const by={},u=HouserCloud.user(),own=m=>!m.owner||m.owner===u?.uid;for(const m of (all||[]).filter(own))(by[(m.name||'').trim().toLowerCase()]=by[(m.name||'').trim().toLowerCase()]||[]).push(m);
  for(const g of Object.values(by)){if(g.length<2)continue;g.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    const ph=[];for(const m of g)if(!(await noPhotos(m)))ph.push(m);const keep=ph[0]||g[0];
    for(const m of g)if(m!==keep&&!seen.has(m.id)){out.push({...m,keep,why:'duplikat „'+m.name+'” (zostaje nowszy'+(ph.length?' ze zdjęciami':'')+' z '+fmtTime(keep.updatedAt)+')'});seen.add(m.id)}}
  return out}

    h+='<div class="cur"><div class="thumb" id="pmCurThumb">'+planSvg(p)+'</div><div><h3>'+esc(projName(p))+' <button class="btn2 sm" id="pmRename" title="Zmień nazwę">✎</button>'+todoBadge(curTodo())+'</h3><div>'+chips(s)+'</div><div class="meta">'+where+'</div>'+
      '<div class="acts"><a class="btn2 primary" href="#'+last.id+'">Kontynuuj: '+esc(last.name)+' →</a><button class="btn2" id="pmExport">⤓ Eksportuj do pliku</button><button class="btn2'+(p.readOnly?' primary':'')+'" id="pmDup">'+(p.readOnly?(isGuest()?'Zaloguj się, żeby zrobić kopię':'⧉ Zrób kopię do siebie'):'⧉ Duplikuj')+'</button>'+cmpBtn(curCmpSrc(curId),curId||'current',true)+
      (curLinkId(p,st)?'<button class="btn2" id="pmLink" title="Link otwiera ten dom od razu">🔗 Kopiuj link</button>':'')+(u&&st.linked&&st.own?visSel(st.vis,'id="pmVis"'):'')+(u&&st.off?'<button class="btn2" id="pmOn">☁ Zapisuj w chmurze</button>':'')+'</div></div></div>'}
  // jedna lista: każdy dom raz – zapisany w tej przeglądarce, w chmurze albo w obu miejscach
  const cloudIds=new Set((u&&cloudLists.mine||[]).map(m=>m.id)),byId=new Map();
  for(const m of localList)byId.set(m.id,{...m,local:true});
  for(const m of (u&&cloudLists.mine)||[]){const o=byId.get(m.id);byId.set(m.id,o?{...o,...m,cover:m.cover||o.cover,plan:o.plan||m.plan,updatedAt:(m.updatedAt||'')>(o.updatedAt||'')?m.updatedAt:o.updatedAt,local:true,cloud:true,localAt:o.updatedAt}:{...m,cloud:true})}
  if(p&&curId&&!byId.has(curId)&&canSave(p)&&!p.sharedEdit)byId.set(curId,{id:curId,name:projName(p),updatedAt:rec.updatedAt,local:true,stats:stats(p),visibility:st.vis||undefined,cloud:!!st.linked});
  const all=[...byId.values()].sort((a,b)=>(b.id===curId)-(a.id===curId)||(b.updatedAt||'').localeCompare(a.updatedAt||''));
  // bez konta nie ma autora, więc nie ma „moich” domów – sama lista domów do oglądania (bez filtra)
  const guest=isGuest(),pf=guest?'all':(lsGet(PM_F)||'all');
  const pv=lsGet(PM_V)||'tiles';
  h+='<h2 class="sec">Domy</h2><div class="pmtools">'+(guest?'<span></span>':'<div class="pmfilter" id="pmF">'+[['all','Wszystkie'],['mine','Moje'],['other','Nie moje']].map(([k,t])=>'<button class="fchip'+(pf===k?' on':'')+'" data-f="'+k+'">'+t+' <span class="n" id="pmN_'+k+'"></span></button>').join('')+'</div>')+
    '<div class="pmview" id="pmV">'+[['tiles','▦ Kafle'],['list','☰ Lista']].map(([k,t])=>'<button class="fchip'+(pv===k?' on':'')+'" data-v="'+k+'">'+t+'</button>').join('')+'</div></div>';
  if(st.enabled&&!u)h+='<div class="login"><p>Bez konta możesz tylko oglądać domy. Zaloguj się, żeby mieć swoje domy – zapisują się w chmurze, otworzysz je na każdym urządzeniu i sam zdecydujesz, kto je widzi.</p><button class="btn2 primary" id="pmLogin">'+GICON+' Zaloguj przez Google</button></div>';
  if(u&&!cloudLists.mine)h+='<div class="empty2">Wczytuję projekty z chmury…</div>';
  // jedna lista: moje domy, potem cudze (społeczność i baza Housera – autor „Houser”); filtr tylko ukrywa wiersze
  const pubOthers=(cloudLists.pub||[]).filter(m=>!u||m.owner!==u.uid);
  h+='<div class="plist'+(guest?' guest':'')+(pv==='tiles'?' tiles':'')+'" id="pmList" data-f="'+pf+'">'+(guest?'':all.length?all.map(m=>pmRow(m,m.id===curId)).join(''):'<div class="login mineOnly"><p>Tu pojawią się Twoje domy – każdy zapisuje się sam po pierwszej zmianie.</p></div>')+pubOthers.map(m=>'<div class="prow other" data-pub="'+esc(m.id)+'"><div class="pth">'+(thumbImg(m)||'')+'</div><div class="pinfo"><b><span class="own0">Nie mój</span><span class="todoSlot" data-tid="'+esc(m.id)+'">'+todoBadge(todoOf(m))+'</span>'+esc(m.name||'bez nazwy')+'</b><small>autor: '+esc(m.ownerName||'?')+'</small><span class="vis pub">'+VIS_LABEL[m.visibility==='public_edit'?'public_edit':'public']+'</span></div><div class="pacts"><button class="btn2 sm primary" data-a="pubopen">'+(m.visibility==='public_edit'&&u?'✏️ Otwórz':'👁 Podgląd')+'</button><button class="btn2 sm" data-a="publink" title="Link otwiera ten dom od razu">🔗</button></div></div>').join('')+'<div id="pmBase" style="display:contents"></div></div>';
  el.innerHTML=h;fillCovers(el);pmCounts();paintBase().then(pmCounts);el.querySelectorAll('#pmV [data-v]').forEach(b=>b.onclick=()=>{lsSet(PM_V,b.dataset.v);$('pmList').classList.toggle('tiles',b.dataset.v==='tiles');el.querySelectorAll('#pmV .fchip').forEach(x=>x.classList.toggle('on',x===b))});el.querySelectorAll('#pmF [data-f]').forEach(b=>b.onclick=()=>{lsSet(PM_F,b.dataset.f);$('pmList').dataset.f=b.dataset.f;el.querySelectorAll('#pmF .fchip').forEach(x=>x.classList.toggle('on',x===b))});el.querySelectorAll('[data-a="pubopen"]').forEach(b=>b.onclick=async()=>{const id=b.closest('[data-pub]').dataset.pub;await openCloud(id);goToHouse(id)});el.querySelectorAll('[data-a="publink"]').forEach(b=>b.onclick=()=>copyLink(b.closest('[data-pub]').dataset.pub));autoTidy(all);fillTodo([...all,...pubOthers.map(m=>({...m,local:false,cloud:true}))],curId);coverOf(p).then(c=>{const t=$('pmCurThumb');if(!c||!t)return;t.classList.add('hasCover');t.innerHTML='<img class="coverImg" alt="" src="'+c+'"><div class="miniPlan">'+planSvg(p)+'</div><a class="galLink" href="#galeria">Galeria →</a>'}).catch(()=>{});
  $('pmNew').onclick=newEmpty;if($('pmSeed'))$('pmSeed').onclick=seedHouser;$('pmImport').onchange=e=>{const f=e.target.files[0];e.target.value='';importFile(f)};
  if($('pmRename'))$('pmRename').onclick=renameCurrent;if($('pmExport'))$('pmExport').onclick=()=>downloadProject(HouserStore.load().project);
  if($('pmDup'))$('pmDup').onclick=()=>isGuest()?doLogin():duplicateCurrent();if($('pmLink'))$('pmLink').onclick=()=>copyLink(curLinkId(p,st));if($('pmVis'))$('pmVis').onchange=async e=>{const v=e.target.value;if((await setVis(st.pid,v))===false)e.target.value=st.vis||'private'};el.querySelectorAll('select[data-vis]').forEach(sel=>{const m0=sel.value;sel.onchange=async()=>{if((await setVis(sel.closest('.prow').dataset.id,sel.value))===false)sel.value=m0}});
  if($('pmOn'))$('pmOn').onclick=()=>{HouserCloud.enable(st.pid);HouserCloud.saveNow().then(()=>{cloudLists.t=0;wantCloudLists()})};if($('pmLogin'))$('pmLogin').onclick=doLogin;
  el.querySelectorAll('.prow[data-id] [data-a]').forEach(b=>b.onclick=async()=>{const id=b.closest('.prow').dataset.id,a=b.dataset.a,m=byId.get(id);if(!m)return;
    const useCloud=m.cloud&&(!m.local||(m.updatedAt||'')>(m.localAt||m.updatedAt||'')); // nowsza wersja wygrywa
    if(a==='open'){await (useCloud?openCloud(id):openLocal(id));goToHouse(id);return}
    if(a==='dup')return m.cloud&&!m.local?duplicateCloud(m):duplicateLocal(id);
    if(a==='exp'){try{downloadProject(useCloud?(await HouserCloud.fetchProject(id)).project:(await HouserLibrary.get(id)).project)}catch(e){alert('Nie udało się pobrać: '+e.message)}return}
    if(a==='link')return copyLink(id);
    if(a==='del'){if(!confirm('Usunąć projekt „'+(m.name||'')+'” razem z jego zdjęciami?\n\nTego nie da się cofnąć.'))return;
      try{if(m.cloud)await HouserCloud.remove(id);if(m.local)await HouserLibrary.remove(id);for(const r of await HouserGallery.list(id))await HouserGallery.remove(r.id);
        toast('Usunięto „'+(m.name||'')+'”');localList=await HouserLibrary.list();cloudLists.t=0;if(m.cloud)wantCloudLists();renderProjects(true)}catch(e){alert('Nie udało się usunąć: '+e.message)}}});
  el.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [src,...r]=b.dataset.cmp.split('|');toggleCmp(src,src==='current'?'current':r.join('|'))});
  if(!noLoad){HouserLibrary.list().then(l=>{localList=l;renderProjects(true)}).catch(()=>{});wantCloudLists()}}
async function doLogin(){try{await HouserCloud.signIn()}catch(e){alert('Logowanie nie powiodło się: '+(e.message||e))}}
function renderUserMenu(){const u=HouserCloud.user(),m=$('umenu');if(!u){m.hidden=true;return}
  m.innerHTML='<div class="who">'+avatar(u)+'<div><b>'+esc(u.name)+'</b><small>'+esc(u.email)+'</small></div></div><a href="#projekty" id="umMine">Moje projekty</a><button id="umOut">Wyloguj</button>';
  $('umMine').onclick=()=>{m.hidden=true};$('umOut').onclick=async()=>{m.hidden=true;await HouserCloud.signOut()}}
if(HouserCloud.enabled){
  $('pbUser').onclick=e=>{e.stopPropagation();if(!HouserCloud.user())return doLogin();renderUserMenu();const m=$('umenu'),r=$('pbUser').getBoundingClientRect();m.style.top=(r.bottom+6)+'px';m.style.right=Math.max(8,innerWidth-r.right)+'px';m.hidden=!m.hidden};
  document.addEventListener('click',e=>{if(!e.target.closest('#acct'))$('umenu').hidden=true});
  let lastState='';HouserCloud.onStatus(st=>{renderCloudBar();if(st.state!==lastState){lastState=st.state;if(st.state==='saved'){if(cloudLists.mine&&!cloudLists.mine.some(m=>m.id===st.pid)){cloudLists.t=0;wantCloudLists()}else refreshViews(true)}}});
  HouserCloud.onAuth(u=>{cloudLists={mine:null,pub:null};refreshViews();
    // po zalogowaniu bieżący projekt (jeśli był zmieniany w tej przeglądarce) trafia do chmury
    const pid=HouserStore.load()?.project?.projectId;if(u&&pid)HouserLibrary.get(pid).then(r=>{if(r)HouserCloud.touch('project')}).catch(()=>{})});
  HouserGallery.onChange(()=>{HouserCloud.touch('photos');refreshViews(true)});
  HouserCloud.init().catch(()=>{});
}
HouserStore.subscribe(onStoreChange);
// kompletność domu: moduły z niepodjętymi decyzjami świecą w menu, w module pasek „liczę na założeniach” + Zatwierdź
function renderTodo(){let C=null;try{const rec=HouserStore.load();if(rec?.project&&window.HouserComplete)C=HouserComplete.check(rec.project)}catch(e){console.error(e)}
  document.querySelectorAll('.tab').forEach(t=>{const todo=!!C&&(C.byMod[t.dataset.id]||[]).some(i=>!i.done);t.classList.toggle('todo',todo);if(todo)t.dataset.todo='1';else delete t.dataset.todo});
  for(const [id,sec] of Object.entries(frames)){const bar=sec.querySelector('.todoBar');if(!bar)continue;const open=C?(C.byMod[id]||[]).filter(i=>!i.done):[];bar.hidden=!open.length;if(!open.length)continue;
    const soft=open.filter(i=>!i.strict),hard=open.filter(i=>i.strict);
    bar.innerHTML='<span>'+(hard.length?'⛔ <b>'+hard.map(i=>esc(i.name)).join('; ')+'</b> – do rozwiązania w tym module. ':'')+(soft.length?'⚠ Nie wybrano jeszcze: <b>'+soft.map(i=>esc(i.name)).join(', ')+'</b>. <span class="as">Liczę na założeniach: '+soft.map(i=>esc(i.assumed)).join('; ')+'.</span>':'')+'</span>'+(soft.length?'<button type="button" title="Uznaj obecne ustawienia za wybrane – moduł przestanie świecić">Zatwierdź obecne ustawienia</button>':'');
    const btn=bar.querySelector('button');if(!btn)continue;let ro=false;try{ro=!!HouserStore.lockReason()}catch(_){}if(ro){btn.remove();continue}btn.onclick=()=>{HouserStore.update(p=>{p.confirmed={...(p.confirmed||{}),[id]:new Date().toISOString()}},'shell');renderTodo()}}}
HouserStore.subscribe(renderTodo);setTimeout(renderTodo,0);
try{HouserStore.projectId()}catch(_){}
HouserStore.subscribe(renderBar);HouserStore.subscribe(()=>{if(onHome())renderHome()});renderBar();renderUndo();setInterval(renderBar,30000);
show(location.hash.slice(1)||'projekty');
// link do domu: ?dom=<id> – otwiera dom od razu (cudzy w podglądzie); dom autora „Houser” ma stałe id zapisane w pliku
(async()=>{const q=new URLSearchParams(location.search),d=q.get('dom');if(!d)return;try{
  let base=null;try{base=(await (await fetch('examples/index.json')).json()).find(m=>m.id===d)||null}catch(_){}
  {const c=HouserStore.load()?.project;if(c&&(c.projectId===d||c.readOnly?.pid===d||c.sharedEdit?.pid===d)){syncUrl();return}} // ten dom jest już otwarty (np. odświeżenie strony)
  if(base){if(HouserCloud.enabled){try{await HouserCloud.init();if(await HouserCloud.fetchProject(d).then(()=>true,()=>false)){await openCloud(d,true);return}}catch(_){}}await HouserOpen.sample(base.file);return}
  try{await HouserCloud.init()}catch(_){}try{const c=HouserStore.load()?.project;if(c&&HouserCloud.status().pid===d){toast('Ten dom jest już otwarty.');return}}catch(_){}
  await openCloud(d)}finally{domPending=false;syncUrl()}})();
</script>
